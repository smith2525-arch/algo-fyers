# ==============================================================================
# Render Blueprint Specification (`render.yaml`)
# Deploys Algo Trading Control Center on Render Free Web Services + Neon Postgres
#
# Coexistence Note:
# Reuses `Dockerfile.api` and `Dockerfile.ui` directly without modifying or
# replacing the existing Google Cloud Run deployment configuration in `deploy/`.
#
# Security & Safety Invariants:
# - EXECUTION_MODE is locked to PAPER_ONLY (no real-money broker routing).
# - Zero credentials are stored in this file (`sync: false` prompts in Render UI).
# - Streamlit UI (`atcc-ui`) never receives `DATABASE_URL`.
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Service 1: Stateless FastAPI Backend + Domain Engines (`atcc-api`)
  # ----------------------------------------------------------------------------
  - type: web
    name: atcc-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    healthCheckPath: /health/live
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: "production"
      - key: EXECUTION_MODE
        value: "PAPER_ONLY"
      - key: MARKET_MODE
        value: "HISTORICAL_AND_REPLAY"
      - key: TIMEZONE
        value: "Asia/Kolkata"
      - key: LOG_LEVEL
        value: "INFO"
      - key: LOG_JSON
        value: "true"
      - key: DB_POOL_MODE
        value: "NULLPOOL"
      - key: DB_SSLMODE
        value: "require"
      - key: DB_CONNECT_TIMEOUT_SECONDS
        value: "15"
      - key: REPLAY_WORKER_ENABLED
        value: "false"
      - key: AUTO_SEED_REFERENCE_DATA
        value: "false"
      - key: FYERS_HISTORICAL_DATA_ENABLED
        value: "true"
      - key: FYERS_MAX_DATE_RANGE_DAYS
        value: "365"
      - key: FYERS_DEFAULT_DATE_RANGE_DAYS
        value: "90"
      - key: DATABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FYERS_CLIENT_ID
        sync: false
      - key: FYERS_ACCESS_TOKEN
        sync: false

  # ----------------------------------------------------------------------------
  # Service 2: Stateless Streamlit Control Console (`atcc-ui`)
  # ----------------------------------------------------------------------------
  - type: web
    name: atcc-ui
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.ui
    dockerContext: .
    healthCheckPath: /_stcore/health
    autoDeploy: true
    envVars:
      - key: API_BASE_URL
        sync: false
      - key: API_TIMEOUT_SECONDS
        value: "25"
