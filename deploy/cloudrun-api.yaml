# ==============================================================================
# Declarative Google Cloud Run Service — FastAPI Backend (`deploy/cloudrun-api.yaml`)
# Cost-Protected Portfolio Configuration:
# - minScale: "0" (scales completely to ₹0 when idle)
# - maxScale: "2" (hard cap preventing unexpected autoscaling charges)
# - cpu-throttling: "true" (request-scoped CPU billing; zero idle CPU charges)
# - DATABASE_URL mounted strictly from Google Secret Manager (zero embedded secrets)
# ==============================================================================
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: atcc-api
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "2"
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 20
      timeoutSeconds: 60
      serviceAccountName: atcc-runtime-sa@REPLACE_WITH_GCP_PROJECT_ID.iam.gserviceaccount.com
      containers:
        - image: asia-south1-docker.pkg.dev/REPLACE_WITH_GCP_PROJECT_ID/algo-control-center/atcc-api:latest
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - name: APP_ENV
              value: "production"
            - name: EXECUTION_MODE
              value: "PAPER_ONLY"
            - name: MARKET_MODE
              value: "HISTORICAL_AND_REPLAY"
            - name: TIMEZONE
              value: "Asia/Kolkata"
            - name: DB_POOL_MODE
              value: "NULLPOOL"
            - name: DB_SSLMODE
              value: "require"
            - name: DB_CONNECT_TIMEOUT_SECONDS
              value: "15"
            - name: REPLAY_WORKER_ENABLED
              value: "false"
            - name: AUTO_SEED_REFERENCE_DATA
              value: "false"
            - name: CORS_ALLOWED_ORIGINS
              value: "https://REPLACE_WITH_UI_CLOUD_RUN_URL"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: atcc-neon-database-url
                  key: latest
          startupProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
