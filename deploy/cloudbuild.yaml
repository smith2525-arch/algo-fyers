# ==============================================================================
# Google Cloud Build Pipeline (`deploy/cloudbuild.yaml`)
# Builds and pushes both stateless images (`atcc-api` & `atcc-ui`) to Artifact
# Registry without requiring a local Docker daemon or VM.
# ==============================================================================
substitutions:
  _REGION: asia-south1
  _AR_REPO: algo-control-center
  _TAG: latest

steps:
  - id: build-api
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.api
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/atcc-api:${_TAG}
      - .

  - id: build-ui
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.ui
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/atcc-ui:${_TAG}
      - .

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/atcc-api:${_TAG}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/atcc-ui:${_TAG}
