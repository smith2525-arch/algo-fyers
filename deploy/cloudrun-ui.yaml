# ==============================================================================
# Declarative Google Cloud Run Service — Streamlit Console (`deploy/cloudrun-ui.yaml`)
# Cost-Protected Portfolio Configuration:
# - minScale: "0" (scales completely to ₹0 when idle)
# - maxScale: "2" (hard cap preventing unexpected autoscaling charges)
# - cpu-throttling: "true" (request-scoped CPU billing)
# - Zero database credentials; communicates solely via runtime `API_BASE_URL`
# ==============================================================================
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: atcc-ui
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "2"
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 15
      timeoutSeconds: 300
      serviceAccountName: atcc-ui-sa@REPLACE_WITH_GCP_PROJECT_ID.iam.gserviceaccount.com
      containers:
        - image: asia-south1-docker.pkg.dev/REPLACE_WITH_GCP_PROJECT_ID/algo-control-center/atcc-ui:latest
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - name: API_BASE_URL
              value: "https://REPLACE_WITH_API_CLOUD_RUN_URL"
            - name: API_TIMEOUT_SECONDS
              value: "25.0"
          startupProbe:
            httpGet:
              path: /_stcore/health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
